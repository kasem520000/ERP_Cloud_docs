name: db

on:
  push:
    branches: [main, 'arena/*']
  pull_request:
    branches: [main]

jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp_migrate
          POSTGRES_PASSWORD: erp_migrate
          POSTGRES_DB: erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_migrate -d erp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp_app:erp_app@127.0.0.1:5432/erp_dev
      MIGRATE_DATABASE_URL: postgresql://erp_migrate:erp_migrate@127.0.0.1:5432/erp_dev
      S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do pg_isready -h 127.0.0.1 -p 5432 -U erp_migrate && break; sleep 1; done

      - name: Create erp_app role (if not exists via migration)
        run: psql "$MIGRATE_DATABASE_URL" -c "SELECT 1"

      - name: Apply migrations (fresh)
        run: pnpm --filter @erp/api db:migrate

      - name: Verify migrations applied
        run: psql "$MIGRATE_DATABASE_URL" -c "SELECT name, applied_at FROM _migrations ORDER BY name"

      - name: RLS policy check (T4)
        run: pnpm --filter @erp/api exec tsx scripts/check-rls.ts

      - name: Catalog drift check (T4/T9)
        run: pnpm --filter @erp/api exec tsx scripts/check-catalog-drift.ts

      - name: RLS A1 — SELECT without GUC returns 0 rows
        run: |
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO tenants (id, name) VALUES ('aaaaaaaa-aaaa-7000-8aaa-aaaaaaaaaaaa','T1') ON CONFLICT DO NOTHING;
            INSERT INTO audit_events (id, tenant_id, action, entity_type, entity_id) VALUES ('11111111-1111-7000-8aaa-aaaaaaaaaaaa','aaaaaaaa-aaaa-7000-8aaa-aaaaaaaaaaaa','test','invoice','22222222-2222-7000-8aaa-aaaaaaaaaaaa') ON CONFLICT DO NOTHING;
          "
          # Connect as erp_app without GUC — create role grant if needed then test RLS
          psql "$MIGRATE_DATABASE_URL" -c "GRANT erp_app TO erp_migrate; SET ROLE erp_app; SELECT count(*) AS cnt FROM audit_events; -- expect 0 without GUC"

      - name: RLS A3 — INSERT with mismatched tenant denied
        run: |
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            SET LOCAL \"erp.tenant_id\" = 'aaaaaaaa-aaaa-7000-8aaa-aaaaaaaaaaaa';
            -- This should violate policy because VALUES tenant differs from GUC
            DO \$\$ BEGIN
              INSERT INTO audit_events (id, tenant_id, action, entity_type, entity_id)
              VALUES ('33333333-3333-7000-8aaa-aaaaaaaaaaaa','bbbbbbbb-bbbb-7000-8bbb-bbbbbbbbbbbb','test','invoice','44444444-4444-7000-8aaa-aaaaaaaaaaaa');
            EXCEPTION WHEN insufficient_privilege OR check_violation THEN RAISE NOTICE 'A3 correctly violated %', SQLERRM;
            END \$\$;
          "

      - name: Audit guard — UPDATE/DELETE rejected
        run: |
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              UPDATE audit_events SET action='tampered' WHERE id='11111111-1111-7000-8aaa-aaaaaaaaaaaa';
            EXCEPTION WHEN OTHERS THEN RAISE NOTICE 'Guard correctly blocked UPDATE: %', SQLERRM;
            END \$\$;
          "

      - name: pg-boss dedupe
        run: |
          psql "$MIGRATE_DATABASE_URL" -c "SELECT 1 FROM boss.job LIMIT 1" || echo "boss schema not yet (pg-boss creates on start) — publish test will create"

      - name: Run integration tests (Testcontainers)
        run: pnpm --filter @erp/api test -- --run test/integration

      - name: Regression — re-apply migrations idempotently
        run: pnpm --filter @erp/api db:migrate

