# ERP Platform — development Compose (PHASE-001)
# Boot: docker compose up -d
# Verify: docker compose ps ; curl http://localhost:3001/health/live ; open http://localhost:3000/ar
name: erp-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev}
      POSTGRES_DB: ${POSTGRES_DB:-erp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_dev} -d ${POSTGRES_DB:-erp_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API + Web as buildable services (optional profile — default dev uses `pnpm dev`)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://erp_app:erp_app@postgres:5432/erp_dev}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-32-chars-min}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-erp-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/live | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
      WEB_PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
