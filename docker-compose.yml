# PHASE-001 development stack (docs/operations/DEVELOPMENT_SETUP.md §3).
# Infrastructure + app skeletons with healthchecks. Roles erp_migrate/erp_app are
# created by migration 0001 in PHASE-002; the compose postgres starts with a
# bootstrap superuser for that migration to use.
name: erp-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp
      LOG_LEVEL: debug
      WORKER_MODE: "0"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Same api image/process entrypoint with WORKER_MODE=1 (DEVELOPMENT_SETUP.md §2).
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["worker"]
    environment:
      PORT: "3002"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp
      WORKER_MODE: "1"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
